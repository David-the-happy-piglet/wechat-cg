<label>
  <input type="checkbox" name="emotional_title_reference" value="true"
         {% if title_reference_enabled %}checked{% endif %} style="width:auto;margin-right:8px">
  参考情感标题写法（可选）
</label>
<p class="field-help">默认关闭。开启后只参考符合共鸣型规则的写法：一句判断、25字以内、不用问号，标题中的细节必须有正文支撑。</p>
<details>
  <summary>查看标题参考</summary>
  <p class="field-help"><strong>钩子型：</strong>悬念、反差、对白、数字、自述。留出信息缺口，让读者想知道后续。</p>
  <p class="field-help"><strong>共鸣型：</strong>精准细节、替你说话、处境锚定、情绪合法化、独白。指向具体处境，避免空泛鸡汤。</p>
  <p class="field-help"><strong>金句型：</strong>否定重置、对仗、悖论、重复回环、断言。适合结尾，不为对仗牺牲准确度，不套成语节奏。</p>
  <p class="field-help">可结合“前半共鸣＋后半钩子”，正文须同时兑现两边。开头从具体处境进入，结尾停在一句话或画面，不强造金句；短片片名的两到四字规则不用于文章标题。</p>
</details>

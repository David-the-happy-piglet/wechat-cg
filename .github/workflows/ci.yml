name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wechat-backend:
    name: WeChat backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wechat-content-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            wechat-content-service/requirements.txt
            wechat-content-service/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check app tests migrations

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r wechat-content-service/requirements.txt
      - name: Validate empty database migrations
        working-directory: wechat-content-service
        env:
          DATABASE_URL: sqlite:////tmp/ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - run: docker compose -f docker-compose.yml config --quiet
